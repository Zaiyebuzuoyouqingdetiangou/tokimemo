<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房间像素小人检查</title><style>body{background:#f3eff3;color:#44384c;font:16px system-ui;padding:16px;margin:0}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{padding:12px;background:#fffaf2;border:1px solid #d8cddc;border-radius:20px;text-align:center}svg{width:100%;max-width:180px;image-rendering:pixelated}b{display:block;font-size:14px}p{line-height:1.8}</style><h2>像素外形 · 隔离样本</h2><p>仅使用已保存外形参数。点击与台词仍由房间原有入口处理。</p><main></main><script type="module">
import {roomFigureSvg} from '../src/ui/roomInterior.js';
const fixtures=[['银发长衣',{hairTone:'silver',hairShape:'long',outfit:'robe',build:'slender'}],['短发护甲',{hairTone:'black',hairShape:'short',outfit:'combat',build:'broad'}],['红发束发',{hairTone:'red',hairShape:'tied',outfit:'formal'}],['卷发工匠',{hairTone:'brown',hairShape:'curly',outfit:'artisan'}]];
document.querySelector('main').innerHTML=fixtures.map(([name,figure])=>`<article><svg viewBox="-70 -115 140 220" role="img" aria-label="${name}">${roomFigureSvg(figure)}</svg><b>${name}</b></article>`).join('');
</script></html>
